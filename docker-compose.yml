services:
  postgres:
    image: postgres:16-alpine
    container_name: finapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-finapp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finapp_password}
      POSTGRES_DB: ${DB_NAME:-finapp}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finapp_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-finapp_user}:${DB_PASSWORD:-finapp_password}@postgres:5432/${DB_NAME:-finapp}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      TZ: America/Sao_Paulo
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finapp_frontend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  dns:
    image: 4km3/dnsmasq:2.85-r2
    container_name: finapp_dns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    cap_add:
      - NET_ADMIN
    command:
      - --keep-in-foreground
      - --address=/finapp.zt/172.23.17.157
      - --server=1.1.1.1
      - --server=1.0.0.1
      - --server=8.8.8.8
      - --server=8.8.4.4
      - --no-resolv
      - --cache-size=1500
      - --neg-ttl=60
      - --log-queries

volumes:
  postgres_data:
