services:
  postgres:
    image: postgres:16-alpine
    container_name: finapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-finapp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:-finapp}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem "ports": o banco so e acessivel pelos outros containers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finapp_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-finapp_user}:${DB_PASSWORD:?defina DB_PASSWORD no .env}@postgres:5432/${DB_NAME:-finapp}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      WEBHOOK_REQUIRE_TOKEN: ${WEBHOOK_REQUIRE_TOKEN:-false}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      TZ: America/Sao_Paulo
    # Sem "ports": so o nginx (frontend) fala com o backend, pela rede interna.
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finapp_frontend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      # Publicado SOMENTE no IP do ZeroTier da VM (nunca em 0.0.0.0).
      - "${ZT_IP:?defina ZT_IP no .env}:443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres_data:
