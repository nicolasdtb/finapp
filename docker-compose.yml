services:
  postgres:
    image: postgres:16-alpine
    container_name: finapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finapp_user
      POSTGRES_PASSWORD: finapp_password
      POSTGRES_DB: finapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finapp_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://finapp_user:finapp_password@postgres:5432/finapp
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finapp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
