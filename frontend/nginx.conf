events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name finapp.zt 172.23.17.157 localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name finapp.zt 172.23.17.157 localhost;

        ssl_certificate /etc/nginx/certs/finapp.crt;
        ssl_certificate_key /etc/nginx/certs/finapp.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Frontend estatico
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location = /health {
            proxy_pass http://finapp_backend:3001/health;
        }

        # Proxy reverso para o backend Fastify (elimina a necessidade da porta 3001)
        location /api/ {
            proxy_pass http://finapp_backend:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}