events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Extratos bancarios (CSV/OFX) podem passar de 1 MB
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Apenas HTTPS (a camera do leitor de QR Code exige contexto seguro).
    # A porta 80 nao e publicada, entao nao ha redirecionamento HTTP.
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/finapp.crt;
        ssl_certificate_key /etc/nginx/certs/finapp.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Frontend estatico
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location = /health {
            proxy_pass http://finapp_backend:3001/health;
        }

        # Proxy reverso para o backend Fastify
        location /api/ {
            proxy_pass http://finapp_backend:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
